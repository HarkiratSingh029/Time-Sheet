[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-timesheets"
version = "0.1.0"
description = "TS Timesheets — central timesheet, approval and project billability tracking"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "brands/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# An en dash is correct typography in a date range, and this product shows plenty of them.
# RUF001 guards against homoglyphs in code, not punctuation in display strings.
allowed-confusables = ["–", "—", "·"]
ignore = [
  # The repo prefers expressive names over prose; ARG/ANN-style noise is not enforced.
  "B008", # FastAPI's Depends() in defaults is the framework's idiom.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
