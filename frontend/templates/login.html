{% extends "base.html" %}
{% block title %}Sign in — TS Timesheets{% endblock %}
{% block main_class %}centred{% endblock %}

{% block body %}
<h1>Sign in</h1>
<p class="page__lede">Log and approve time against your projects.</p>

{% if error %}
  <p class="notice notice--error" role="alert">{{ error }}</p>
{% endif %}

<form class="form" method="post" action="/login">
  <label class="field">
    <span class="field__label">Email</span>
    <input class="field__input" type="email" name="email" autocomplete="username" required autofocus>
  </label>

  <label class="field">
    <span class="field__label">Password</span>
    <input class="field__input" type="password" name="password" autocomplete="current-password" required>
  </label>

  <div class="form__actions">
    <button class="button button--primary" type="submit">Sign in</button>
  </div>
</form>
{% endblock %}
